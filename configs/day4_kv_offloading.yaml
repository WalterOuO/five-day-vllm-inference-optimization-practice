model_id: "Qwen/Qwen2.5-3B-Instruct"

# 限制 GPU 顯存上限為 0.65 (T4 GPU 15.2GB 中約預留 9.88 GB)
gpu_memory_utilization: 0.65
max_model_len: 14000

# 壓測參數：8 併發 x 12K 長文本 (需求約 3.30 GiB KV Cache)
concurrency: 8
prompt_stitching_count: 12
max_tokens: 64

# Chunked Prefill 參數
baseline_chunked: false
optimization_chunked: true
max_num_batched_tokens: 2048